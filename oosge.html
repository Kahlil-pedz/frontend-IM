<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreadPitt Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .soft-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.03);
        }

        .custom-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background-color: #ffffff;
        }
        .custom-checkbox:checked {
            background-color: #0f172a;
            border-color: #0f172a;
        }
        .custom-checkbox:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orange-btn-gradient {
            background: linear-gradient(135deg, #ff7e29 0%, #f95700 100%);
            box-shadow: 0 4px 14px 0 rgba(249, 87, 0, 0.3);
        }
        .orange-btn-gradient:hover {
            background: linear-gradient(135deg, #f95700 0%, #e04e00 100%);
            box-shadow: 0 6px 18px 0 rgba(249, 87, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 lg:p-8 flex items-center justify-center">

    <div class="w-full max-w-[1360px] bg-white rounded-[28px] p-4 sm:p-6 shadow-2xl border border-slate-100 flex flex-col gap-6">

        <header class="flex items-center justify-between gap-4 pb-4 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-500 to-red-500 flex items-center justify-center shadow-md shadow-orange-500/20">
                    <i class="fa-solid fa-mug-hot text-white text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-900">Bread<span class="text-orange-500">Pitt</span></span>
            </div>  

            <div class="flex items-center gap-2">
                <button onclick="showToast('No new notifications')" class="w-10 h-10 rounded-xl border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition relative">
                    <i class="fa-regular fa-bell text-sm"></i>
                    <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-orange-500 rounded-full"></span>
                </button>
                <div class="flex items-center gap-3 pl-2 border-l border-slate-200">
                    <img src="https://tr.rbxcdn.com/180DAY-99bc9c6c9cb64b72d7039a52c27c6e90/420/420/FaceAccessory/Webp/noFilter" alt="User Avatar" class="w-10 h-10 rounded-xl object-cover ring-2 ring-slate-100">
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <section class="lg:col-span-7 flex flex-col gap-5">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-2 overflow-x-auto pb-1">
                        <button onclick="filterCategory('All', this)" class="category-pill active-pill px-4 py-2 bg-slate-900 text-white text-xs font-semibold rounded-full whitespace-nowrap transition">All Items</button>
                        <button onclick="filterCategory('Coffee', this)" class="category-pill px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-full whitespace-nowrap transition">Coffee</button>
                        <button onclick="filterCategory('Bakery', this)" class="category-pill px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-full whitespace-nowrap transition">Bakery</button>
                        <button onclick="filterCategory('Desserts', this)" class="category-pill px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-full whitespace-nowrap transition">Desserts</button>
                    </div>

                    <div class="relative w-full sm:w-48">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search menu..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
                    </div>
                </div>

                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                </div>
            </section>

            <section class="lg:col-span-5 bg-slate-50/70 border border-slate-200/80 rounded-2xl p-5 flex flex-col gap-5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <h2 class="text-lg font-bold text-slate-900">Cart</h2>
                        <span id="cartBadgeCount" class="bg-orange-100 text-orange-600 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <button onclick="clearAllCart()" class="text-xs font-semibold text-orange-500 hover:text-orange-600 transition">
                        Delete All
                    </button>
                </div>

                <div id="cartList" class="flex flex-col gap-3 max-h-[380px] overflow-y-auto pr-1">
                </div>

                <div class="bg-white border border-slate-200/80 rounded-xl p-3 flex flex-col gap-2 shadow-sm">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-ticket text-orange-500 text-xs"></i>
                        <span class="text-xs font-bold text-slate-700">Voucher Code</span>
                        <span class="text-[10px] text-slate-400 ml-auto">(Try: <code class="bg-slate-100 px-1 py-0.5 rounded text-orange-600 font-semibold">BREAD10</code>)</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="voucherInput" placeholder="Enter voucher code..." class="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs uppercase tracking-wider focus:outline-none focus:border-orange-500 transition">
                        <button id="applyVoucherBtn" onclick="applyVoucher()" class="orange-btn-gradient text-white text-xs font-bold px-4 py-2 rounded-lg transition whitespace-nowrap">
                            Apply
                        </button>
                    </div>
                    <div id="voucherStatus" class="text-[11px] font-semibold hidden"></div>
                </div>

                <div class="bg-white border border-slate-200/80 rounded-xl p-4 flex flex-col gap-2.5 shadow-sm">
                    <div class="flex justify-between items-center text-xs font-medium text-slate-500">
                        <span>Subtotal</span>
                        <span id="subtotalPrice" class="font-bold text-slate-700">₱0.00</span>
                    </div>
                    <div id="discountRow" class="flex justify-between items-center text-xs font-medium text-slate-500 hidden">
                        <span>Discount (<span id="discountPercentText">10%</span>)</span>
                        <span id="discountPrice" class="font-bold text-emerald-600">-₱0.00</span>
                    </div>
                    <div class="h-px bg-slate-100 my-1"></div>
                    <div class="flex justify-between items-center text-sm font-bold text-slate-800">
                        <span>Total Payment</span>
                        <span id="totalPaymentPrice" class="text-lg text-slate-900">₱0.00</span>
                    </div>
                </div>

                <button onclick="proceedToPayment()" class="w-full orange-btn-gradient text-white font-bold py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20 active:scale-[0.99]">
                    Proceed to Payment <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </section>
        </div>
    </div>

    <div id="paymentModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full mx-4 shadow-2xl flex flex-col items-center text-center gap-4 transform scale-95 transition-transform duration-300">
            <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center text-2xl font-bold">
                <i class="fa-solid fa-check"></i>
            </div>
            <div>
                <h3 class="text-xl font-bold text-slate-800">Order Confirmed!</h3>
                <p class="text-xs text-slate-500 mt-1">Your order has been placed successfully.</p>
            </div>
            <div id="orderModalSummary" class="w-full bg-slate-50 rounded-xl p-3 border border-slate-200/80 text-xs text-left space-y-1.5">
            </div>
            <button onclick="closePaymentModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs transition">
                Back to Dashboard
            </button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="fa-solid fa-circle-info text-orange-400"></i>
        <span id="toastMessage">Notification</span>
    </div>

    <script>
        let products = [
            {
                id: 'prod-1',
                name: 'Spanish Latte',
                category: 'Coffee',
                price: 150.00,
                originalPrice: 165.00,
                specs: '16 oz • Espresso & Sweet Milk',
                liked: true,
                image: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=600&q=80'
            },

            {
                id: 'prod-2',
                name: 'Matcha Latte',
                category: 'Coffee',
                price: 165.00,
                originalPrice: 180.00,
                specs:'16oz • Creamy Matcha',
                liked: false,
                image: 'https://i.pinimg.com/1200x/b8/15/91/b8159103ebf39a3a64160f29850974c9.jpg'
            },
            
             {
                id: 'prod-3',
                name: 'Mocha Latte',
                category: 'Coffee',
                price: 145.00,
                originalPrice: 170.00,
                specs:'16oz • Creamy & Chocolatey',
                liked: false,
                image: 'https://i.pinimg.com/1200x/f5/fb/cb/f5fbcb920fa1f955dd7650dfe803b56f.jpg'
            },

            {
                id: 'prod-4',
                name: 'Croissant',
                category: 'Bakery',
                price: 95.00,
                originalPrice: 110.00,
                specs: 'Freshly Baked • Flaky Layered',
                liked: false,
                image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80'
            },

            {
                id: 'prod-5',
                name: 'French Apple Tart',
                category: 'Bakery',
                price: 110.00,
                originalPrice: 130.00,
                specs: 'Buttery Crust • Sweet & Fruity',
                liked: false,
                image: 'https://i.pinimg.com/1200x/cd/88/d5/cd88d57687efd76aee5a574d125b0078.jpg'
            },
            {
                id: 'prod-6',
                name: 'Blueberry Cheesecake',
                category: 'Desserts',
                price: 120.00,
                originalPrice: 135.00,
                specs: '1 Slice • Blueberry Compote',
                liked: true,
                image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80'
            },

            {
                id: 'prod-7',
                name: 'Moist Chocolate Cake',
                category: 'Desserts',
                price: 135.00,
                originalPrice: 150.00,
                specs: 'Rich Chocolate • Moist & Velvety',
                liked: true,
                image: 'https://i.pinimg.com/736x/62/43/f5/6243f515eae4f41119461e537dea3d2d.jpg'
            },

            {
                id: 'prod-8',
                name: 'Red Velvet Cake',
                category: 'Desserts',
                price: 150.00,
                originalPrice: 170.00,
                specs: 'Velvety Soft • Creamy & Rich',
                liked: true,
                image: 'https://i.pinimg.com/736x/d2/77/6d/d2776db48c372fdd2c6f1a5a8bf5f43d.jpg'
            },

             {
                id: 'prod-9',
                name: 'Cinnamon Roll',
                category: 'Bakery',
                price: 140.00,
                originalPrice: 160.00,
               specs: 'Freshly Baked • Soft & Cinnamon Sweet',
                liked: true,
                image: 'https://i.pinimg.com/736x/2d/21/01/2d2101c743652bc122b7e0863ab168e2.jpg'
            }


        ];

        // Valid voucher database
        const validVouchers = {
            'BREAD10': 0.10,
            'SAVE10': 0.10,
            'BREAD20': 0.20
        };

        let cartItems = [];
        let appliedVoucher = null;
        let discountRate = 0;
        let activeCategory = 'All';

        function renderProducts(productsToRender = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            let filtered = productsToRender;
            if (activeCategory !== 'All') {
                filtered = productsToRender.filter(p => p.category === activeCategory);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs">No items found</div>`;
                return;
            }

            filtered.forEach(prod => {
                const card = document.createElement('div');
                card.className = "soft-card rounded-2xl p-3 flex flex-col justify-between transition-all hover:shadow-md group";

                card.innerHTML = `
                    <div class="relative w-full h-36 rounded-xl overflow-hidden mb-3 bg-slate-100">
                        <img src="${prod.image}" alt="${prod.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <button onclick="toggleLike('${prod.id}')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 backdrop-blur-sm shadow-sm flex items-center justify-center text-slate-400 hover:text-red-500 transition">
                            <i class="${prod.liked ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'} text-xs"></i>
                        </button>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-xs tracking-tight leading-snug line-clamp-1">${prod.name}</h3>
                        <p class="text-[10px] text-slate-400 mt-0.5">${prod.specs}</p>
                        <div class="flex items-center justify-between mt-3">
                            <div class="flex items-baseline gap-1.5">
                                <span class="font-extrabold text-orange-500 text-sm">₱${prod.price.toFixed(2)}</span>
                                <span class="text-[10px] text-slate-400 line-through">₱${prod.originalPrice.toFixed(2)}</span>
                            </div>
                            <button onclick="addToCartFromGrid('${prod.id}')" class="w-7 h-7 rounded-lg orange-btn-gradient text-white flex items-center justify-center transition transform active:scale-90 shadow-sm">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderCart() {
            const list = document.getElementById('cartList');
            list.innerHTML = '';

            document.getElementById('cartBadgeCount').innerText = cartItems.length;

            if (cartItems.length === 0) {
                list.innerHTML = `
                    <div class="py-12 flex flex-col items-center justify-center text-slate-400 gap-2">
                        <i class="fa-solid fa-basket-shopping text-2xl text-slate-300"></i>
                        <p class="text-xs font-semibold">Your cart is empty</p>
                    </div>`;
                updateTotals();
                return;
            }

            cartItems.forEach(item => {
                const itemTotal = item.price * item.qty;
                const row = document.createElement('div');
                row.className = "bg-white border border-slate-200/80 rounded-xl p-3 flex items-center justify-between gap-3 shadow-sm";

                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCartCheck('${item.id}')" class="custom-checkbox">
                        <img src="${item.image}" alt="${item.name}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">
                        <div class="flex flex-col">
                            <h4 class="font-bold text-slate-800 text-xs truncate max-w-[110px] sm:max-w-[130px]">${item.name}</h4>
                            <span class="text-[10px] font-medium text-slate-400 mt-0.5">${item.specs}</span>
                            <div class="flex items-center gap-2 mt-1.5">
                                <button onclick="updateQty('${item.id}', -1)" class="w-5 h-5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center transition">-</button>
                                <span class="text-xs font-bold text-slate-700 min-w-[12px] text-center">${item.qty}</span>
                                <button onclick="updateQty('${item.id}', 1)" class="w-5 h-5 rounded-md orange-btn-gradient text-white font-bold text-xs flex items-center justify-center transition">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col items-end justify-between self-stretch">
                        <button onclick="removeCartItem('${item.id}')" class="text-slate-300 hover:text-red-500 text-xs transition">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                        <div class="text-right">
                            <span class="text-xs font-extrabold text-slate-800">₱${itemTotal.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });

            updateTotals();
        }

        function updateTotals() {
            const checkedItems = cartItems.filter(i => i.checked);
            const subtotal = checkedItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const discount = subtotal * discountRate;
            const total = subtotal - discount;

            document.getElementById('subtotalPrice').innerText = `₱${subtotal.toFixed(2)}`;
            document.getElementById('discountPrice').innerText = `-₱${discount.toFixed(2)}`;
            document.getElementById('totalPaymentPrice').innerText = `₱${total.toFixed(2)}`;
            document.getElementById('discountPercentText').innerText = `${Math.round(discountRate * 100)}%`;

            const discountRow = document.getElementById('discountRow');
            if (discountRate > 0 && discount > 0) {
                discountRow.classList.remove('hidden');
            } else {
                discountRow.classList.add('hidden');
            }
        }

        function applyVoucher() {
            const codeInput = document.getElementById('voucherInput');
            const statusDiv = document.getElementById('voucherStatus');
            const code = codeInput.value.trim().toUpperCase();

            if (!code) {
                statusDiv.className = 'text-[11px] font-semibold text-red-500';
                statusDiv.innerText = 'Please enter a voucher code.';
                statusDiv.classList.remove('hidden');
                return;
            }

            if (validVouchers[code]) {
                discountRate = validVouchers[code];
                appliedVoucher = code;

                statusDiv.className = 'text-[11px] font-semibold text-emerald-600';
                statusDiv.innerText = `✓ Code ${code} applied! (${Math.round(discountRate * 100)}% Off)`;
                statusDiv.classList.remove('hidden');

                showToast(`Voucher ${code} Applied!`);
                updateTotals();
            } else {
                statusDiv.className = 'text-[11px] font-semibold text-red-500';
                statusDiv.innerText = 'Invalid or expired voucher code.';
                statusDiv.classList.remove('hidden');
            }
        }

        function toggleCartCheck(id) {
            const item = cartItems.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                updateTotals();
            }
        }

        function updateQty(id, delta) {
            const item = cartItems.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    removeCartItem(id);
                } else {
                    renderCart();
                }
            }
        }

        function removeCartItem(id) {
            cartItems = cartItems.filter(i => i.id !== id);
            renderCart();
            showToast('Item removed from cart');
        }

        function clearAllCart() {
            if (cartItems.length === 0) return;
            cartItems = [];
            renderCart();
            showToast('Cart cleared');
        }

        function addToCartFromGrid(prodId) {
            const prod = products.find(p => p.id === prodId);
            if (!prod) return;

            const existing = cartItems.find(i => i.prodId === prodId);
            if (existing) {
                existing.qty += 1;
                existing.checked = true;
            } else {
                cartItems.push({
                    id: 'cart-' + Date.now(),
                    prodId: prod.id,
                    name: prod.name,
                    specs: prod.specs,
                    price: prod.price,
                    qty: 1,
                    checked: true,
                    image: prod.image
                });
            }
            renderCart();
            showToast(`Added ${prod.name}`);
        }

        function toggleLike(prodId) {
            const prod = products.find(p => p.id === prodId);
            if (prod) {
                prod.liked = !prod.liked;
                renderProducts();
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.specs.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function filterCategory(categoryName, btn) {
            activeCategory = categoryName;
            document.querySelectorAll('.category-pill').forEach(b => {
                b.classList.remove('bg-slate-900', 'text-white');
                b.classList.add('bg-slate-100', 'text-slate-600');
            });
            btn.classList.remove('bg-slate-100', 'text-slate-600');
            btn.classList.add('bg-slate-900', 'text-white');
            renderProducts();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2200);
        }

        function proceedToPayment() {
            const checkedItems = cartItems.filter(i => i.checked);
            if (checkedItems.length === 0) {
                showToast('Select an item to proceed');
                return;
            }

            const modal = document.getElementById('paymentModal');
            const summaryBox = document.getElementById('orderModalSummary');

            const subtotal = checkedItems.reduce((s, i) => s + (i.price * i.qty), 0);
            const discount = subtotal * discountRate;
            const total = subtotal - discount;

            let discountHTML = discountRate > 0 ? `<div class="flex justify-between text-slate-600"><span>Voucher Discount (${appliedVoucher}):</span> <span class="font-bold text-emerald-600">-₱${discount.toFixed(2)}</span></div>` : '';

            summaryBox.innerHTML = `
                <div class="flex justify-between text-slate-600"><span>Selected Items:</span> <span class="font-bold text-slate-800">${checkedItems.length}</span></div>
                <div class="flex justify-between text-slate-600"><span>Subtotal:</span> <span class="font-bold text-slate-800">₱${subtotal.toFixed(2)}</span></div>
                ${discountHTML}
                <div class="h-px bg-slate-200 my-1"></div>
                <div class="flex justify-between text-slate-800 font-bold text-sm"><span>Total Paid:</span> <span class="text-orange-600">₱${total.toFixed(2)}</span></div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closePaymentModal() {
            const modal = document.getElementById('paymentModal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.onload = function() {
            renderProducts();
            renderCart();
        };
    </script>
</body>
</html>
